# Render blueprint: web service + Postgres. Secrets are set in the Render dashboard, not here.
services:
  - type: web
    name: autojobber
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: autojobber-db, property: connectionString }
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AGENT_TOKEN
        generateValue: true
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
databases:
  - name: autojobber-db
    plan: basic-256mb
